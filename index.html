<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In a Web Click</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #f8f7f4;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }
    h1 span { color: #7c5cfc; }
    .tagline {
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }
    .grid {
      max-width: 320px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      border: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s;
    }
    .card:hover {
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      border-color: #7c5cfc;
    }
    .card-left {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .card-emoji { font-size: 1.2rem; line-height: 1; }
    .card-name { font-weight: 600; font-size: 0.9rem; }
    .card-arrow { color: #bbb; font-size: 0.8rem; }
    .card:hover .card-arrow { color: #7c5cfc; }
    .footer {
      margin-top: 1.5rem;
      color: #ccc;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <h1>In a Web <span>Click</span></h1>
  <p class="tagline">From design</p>

  <div class="grid">

    <a class="card" href="https://pseudonymgit.github.io/pipe-dream-llc/" target="_blank">
      <div class="card-left"><span class="card-emoji">🪠</span><span class="card-name">Pipe Dream LLC</span></div>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="https://pseudonymgit.github.io/golden-dragon/" target="_blank">
      <div class="card-left"><span class="card-emoji">🥟</span><span class="card-name">Golden Dragon</span></div>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="https://pseudonymgit.github.io/nailed-it/" target="_blank">
      <div class="card-left"><span class="card-emoji">💅</span><span class="card-name">Nailed It</span></div>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="https://pseudonymgit.github.io/clock-tick/" target="_blank">
      <div class="card-left"><span class="card-emoji">⏱️</span><span class="card-name">Clock Tick</span></div>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="https://pseudonymgit.github.io/joyous-psych/" target="_blank">
      <div class="card-left"><span class="card-emoji">🧠</span><span class="card-name">Joyous Psych</span></div>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="https://pseudonymgit.github.io/chaz-flores/" target="_blank">
      <div class="card-left"><span class="card-emoji">🏠</span><span class="card-name">Chaz Flores</span></div>
      <span class="card-arrow">→</span>
    </a>

  </div>

  <div class="footer">&copy; 2026 In a Web Click</div>
</body>
</html>
